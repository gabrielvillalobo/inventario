<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escáner · prueba de góndola</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07090D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Escáner">
<style>
:root{
  --fondo:#07090D;
  --vidrio:rgba(38,47,60,.58);
  --vidrio-2:rgba(38,47,60,.38);
  --borde:rgba(255,255,255,.14);
  --brillo:rgba(255,255,255,.16);
  --tinta:#EAF1F8;
  --tinta-2:#8FA0B1;
  --ok:#4FD39B;
  --error:#FF7C69;
  --acento:#7FA8FF;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  --curva:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--fondo);color:var(--tinta);font-family:var(--sans);
  font-size:15px;line-height:1.45;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;font-family:var(--sans)}
:focus-visible{outline:2.5px solid var(--acento);outline-offset:3px;border-radius:14px}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--tinta-2);font-weight:600}
.oculto{display:none!important}

/* ---------- cámara a pantalla completa ---------- */
.escena{position:fixed;inset:0;background:#05070A;overflow:hidden}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mira{position:absolute;left:4%;right:4%;top:50%;transform:translateY(-50%);height:26%;
  border:2px solid rgba(255,255,255,.6);border-radius:14px;pointer-events:none;
  box-shadow:0 0 0 3000px rgba(3,6,10,.5)}
.mira i{position:absolute;left:3%;right:3%;top:50%;height:2px;background:var(--error);
  box-shadow:0 0 14px var(--error);animation:barre 2.2s var(--curva) infinite alternate}
.mira.ok{border-color:var(--ok)}
@keyframes barre{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion:reduce){.mira i{animation:none;top:50%}}

/* ---------- capas ---------- */
.arriba{position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
  display:flex;gap:8px;align-items:center;justify-content:space-between;z-index:5}
.pastilla{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);background-color:var(--vidrio);
  border:1px solid var(--borde);box-shadow:inset 0 1px 0 var(--brillo);white-space:nowrap}
.pastilla.chico{font-size:11px;color:var(--tinta-2);font-weight:500}

.abajo{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.tarjeta{border-radius:24px;padding:14px 16px;
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  background-color:var(--vidrio);border:1px solid var(--borde);
  box-shadow:0 22px 46px -20px rgba(0,0,0,.8), inset 0 1px 0 var(--brillo)}
#codigo{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;word-break:break-all;line-height:1.1}
#codigo.esperando{color:var(--tinta-2);font-size:17px;font-weight:600}
.meta{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;margin-top:5px}
.meta b{font-size:12px;font-weight:650;color:var(--ok)}
.meta small{font-size:11.5px;color:var(--tinta-2)}

.botonera{display:flex;gap:8px}
.botonera button{flex:1;padding:13px 4px;border-radius:18px;font-size:13px;font-weight:600;color:var(--tinta);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);background-color:var(--vidrio);
  border:1px solid var(--borde);box-shadow:inset 0 1px 0 var(--brillo);transition:transform .16s var(--curva)}
.botonera button:active{transform:scale(.95)}
.botonera button.on{background-color:var(--acento);color:#0A1220;border-color:transparent}
.botonera button[disabled]{opacity:.38}
.foto{background-color:rgba(127,168,255,.92)!important;color:#0A1220!important;border-color:transparent!important}

.zoom{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:20px}
.zoom input{flex:1;accent-color:var(--acento);min-width:0}
.zoom span{font-size:12px;color:var(--tinta-2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- panel de resultados ---------- */
.hoja{position:fixed;left:0;right:0;bottom:0;z-index:10;max-height:88dvh;overflow-y:auto;
  border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  -webkit-backdrop-filter:blur(40px) saturate(200%);backdrop-filter:blur(40px) saturate(200%);
  background-color:rgba(24,31,40,.92);border:1px solid var(--borde);border-bottom:0;
  box-shadow:0 -20px 50px rgba(0,0,0,.6);transform:translateY(101%);transition:transform .34s var(--curva)}
.hoja.on{transform:translateY(0)}
.hoja::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 12px}
.hoja h2{margin:0 0 12px;font-size:17px;font-weight:650;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.hoja h2 button{color:var(--acento);font-size:14px;font-weight:500}
.marcador{display:flex;gap:10px;margin-bottom:12px}
.marcador div{flex:1;min-width:0}
.marcador b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lista{display:flex;flex-direction:column;max-height:46vh;overflow-y:auto;margin:0 -4px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;padding:9px 4px;border-top:1px solid rgba(255,255,255,.07);align-items:center}
.item:first-child{border-top:0}
.item b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all}
.item small{display:block;font-size:11.5px;color:var(--tinta-2)}
.item .veces{font-size:12.5px;color:var(--tinta-2);font-variant-numeric:tabular-nums;text-align:right}
.item .veces em{font-style:normal;color:var(--ok);font-weight:650}
.vacio{color:var(--tinta-2);font-size:13.5px;text-align:center;padding:18px 8px;line-height:1.5}
.diag{font-size:11.5px;color:var(--tinta-2);line-height:1.6;margin-top:12px;border-top:1px solid rgba(255,255,255,.07);padding-top:10px}
.diag b{color:var(--tinta);font-weight:600}

/* ---------- pantalla inicial ---------- */
.inicio{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,#16202C,#05070A 70%)}
.inicio h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.035em}
.inicio p{margin:0;color:var(--tinta-2);font-size:14px;max-width:300px;line-height:1.55}
.encender{padding:16px 30px;border-radius:999px;background:var(--acento);color:#0A1220;font-weight:650;font-size:17px;box-shadow:0 16px 34px -14px var(--acento);margin-top:6px}
.encender:active{transform:scale(.96)}
.errorMsg{color:var(--error);font-size:13.5px;line-height:1.5;max-width:320px}
#previo{position:fixed;right:10px;bottom:calc(210px + env(safe-area-inset-bottom));width:120px;border-radius:10px;border:1px solid var(--borde);z-index:6;image-rendering:pixelated}
</style>
</head>
<body>

<div class="escena">
  <video id="cam" playsinline muted autoplay></video>
  <div class="mira oculto" id="mira"><i></i></div>
</div>

<canvas id="previo" class="oculto"></canvas>

<div class="arriba oculto" id="barraArriba">
  <span class="pastilla" id="pMotor">—</span>
  <span class="pastilla chico" id="pDiag">—</span>
</div>

<div class="abajo oculto" id="barraAbajo">
  <div class="tarjeta">
    <div id="codigo" class="esperando">Apuntá al código de barras…</div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="zoom tarjeta oculto" id="zonaZoom">
    <span class="lbl">Zoom</span>
    <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" aria-label="Zoom de la cámara">
    <span id="zoomVal" class="num">1,0×</span>
  </div>
  <div class="botonera">
    <button id="btnLinterna" disabled>Linterna</button>
    <button id="btnGirar">Girar</button>
    <button id="btnLista">Lista <span id="cuenta" class="num">0</span></button>
  </div>
  <div class="botonera">
    <button class="foto" id="btnFoto">Sacar foto del código</button>
  </div>
</div>

<input type="file" accept="image/*" capture="environment" id="archivoFoto" class="oculto">
<div id="cajaArchivo" class="oculto"></div>

<div class="hoja" id="hoja">
  <h2>Lo que leyó <button id="btnCerrar">Cerrar</button></h2>
  <div class="marcador">
    <div><b id="mDistintos" class="num">0</b><span class="lbl">Productos</span></div>
    <div><b id="mTotal" class="num">0</b><span class="lbl">Lecturas</span></div>
    <div><b id="mProm" class="num">—</b><span class="lbl">Promedio</span></div>
  </div>
  <div class="lista" id="lista"><p class="vacio">Todavía no leyó ningún código.</p></div>
  <div class="botonera" style="margin-top:12px">
    <button id="btnLimpiar">Reiniciar</button>
    <button id="btnCompartir">Mandarme la prueba</button>
  </div>
  <p class="diag" id="diagnostico"></p>
</div>

<div class="inicio" id="inicio">
  <h1>Prueba de escáner</h1>
  <p id="ayuda">Ahora lee a resolución completa. Sostené el código a unos 15 cm, dentro del recuadro, y esperá el bip.</p>
  <button class="encender" id="btnEncender">Encender la cámara</button>
  <p class="errorMsg oculto" id="errorMsg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
"use strict";
var $=function(id){ return document.getElementById(id); };

var FORMATOS_NATIVOS=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','code_93','itf','codabar'];
var stream=null, track=null, video=$('cam'), corriendo=false, ocupado=false;
var lienzo=document.createElement('canvas'), ctx=lienzo.getContext('2d',{willReadFrequently:true});
var previo=$('previo'), pctx=previo.getContext('2d');
var detectorNativo=null, zx=null, motor='—', girado=false;
var lecturas=[], porCodigo={}, ultimo='', ultimoT=0, tAnterior=0;
var intentos=0, t0=0, pasada=0, audio=null, verPrevio=false;

/* ================= sonido ================= */
function bip(){
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended') audio.resume();
    var o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
    o.frequency.value=1180; o.type='square';
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.25,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.16);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t+.18);
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
}

/* ================= motores ================= */
function armarZXing(){
  if(!window.ZXing || !ZXing.MultiFormatReader || !ZXing.RGBLuminanceSource) return null;
  try{
    var F=ZXing.BarcodeFormat, H=ZXing.DecodeHintType;
    var formatos=[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.CODE_93,F.ITF,F.CODABAR]
      .filter(function(x){ return x!==undefined; });
    var hints=new Map();
    hints.set(H.POSSIBLE_FORMATS,formatos);
    hints.set(H.TRY_HARDER,true);
    var lector=new ZXing.MultiFormatReader();
    if(lector.setHints) lector.setHints(hints);
    return { lector:lector, hints:hints };
  }catch(e){ return null; }
}
function nombreFormato(f){
  try{
    if(typeof f==='string') return f.toUpperCase().replace(/_/g,'-');
    if(window.ZXing && ZXing.BarcodeFormat && ZXing.BarcodeFormat[f]) return String(ZXing.BarcodeFormat[f]).replace(/_/g,'-');
  }catch(e){}
  return 'código';
}
async function armarNativo(){
  if(!('BarcodeDetector' in window)) return null;
  try{
    var soportados=await window.BarcodeDetector.getSupportedFormats();
    var usar=soportados.filter(function(f){ return FORMATOS_NATIVOS.indexOf(f)>=0; });
    if(!usar.length) return null;
    return new window.BarcodeDetector({ formats:usar });
  }catch(e){ return null; }
}

/* gris con estiramiento de contraste: ayuda en estantes oscuros */
function aGris(img){
  var d=img.data, n=img.width*img.height, g=new Uint8ClampedArray(n);
  var i,j,v,min=255,max=0;
  for(i=0;i<n;i++){
    j=i<<2;
    v=(d[j]*77 + d[j+1]*151 + d[j+2]*28)>>8;
    g[i]=v; if(v<min)min=v; if(v>max)max=v;
  }
  var rango=max-min;
  if(rango>25 && rango<210){
    var k=255/rango;
    for(i=0;i<n;i++) g[i]=(g[i]-min)*k;
  }
  return g;
}
var viaZX=null, sinLeer=0;
function fuenteZX(img){
  /* 1: gris con contraste propio · 2: la clase de canvas de ZXing */
  if(viaZX!==2){
    try{
      var f=new ZXing.RGBLuminanceSource(aGris(img),img.width,img.height);
      viaZX=1; return f;
    }catch(e){ viaZX=2; }
  }
  if(ZXing.HTMLCanvasElementLuminanceSource){
    try{
      var f2=new ZXing.HTMLCanvasElementLuminanceSource(lienzo);
      viaZX=2; return f2;
    }catch(e){}
  }
  return null;
}
function leerConZXing(img){
  if(!zx) return null;
  try{
    var fuente=fuenteZX(img);
    if(!fuente) return null;
    var mapa=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(fuente));
    var res=zx.lector.decode(mapa, zx.hints);
    if(res){ sinLeer=0; return { texto:res.getText(), formato:nombreFormato(res.getBarcodeFormat()) }; }
  }catch(e){
    /* NotFoundException en cada cuadro sin código: es lo normal */
    sinLeer++;
    if(sinLeer===70 && viaZX===1 && ZXing.HTMLCanvasElementLuminanceSource){ viaZX=2; sinLeer=0; }
  }
  finally{ try{ zx.lector.reset(); }catch(e){} }
  return null;
}
async function leerConNativo(fuente){
  if(!detectorNativo) return null;
  try{
    var r=await detectorNativo.detect(fuente);
    if(r && r.length) return { texto:r[0].rawValue, formato:nombreFormato(r[0].format) };
  }catch(e){}
  return null;
}

/* ================= cámara ================= */
async function encender(){
  $('errorMsg').classList.add('oculto');
  bip();
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{ facingMode:{ ideal:'environment' }, width:{ ideal:2560 }, height:{ ideal:1440 }, frameRate:{ ideal:30 } }
    });
  }catch(err){
    var m=String(err && (err.name||err.message||err));
    if(/NotAllowed|Permission|Security/i.test(m)) fallar('No diste permiso a la cámara. Tocá "aA" en la barra de Safari → Ajustes del sitio web → Cámara → Permitir, y recargá la página.');
    else if(/NotFound|NotReadable|Overconstrained|Track/i.test(m)) fallar('No pude abrir la cámara: puede estar en uso por otra app. Cerrá la cámara o WhatsApp y probá otra vez.');
    else fallar('No pude encender la cámara ('+m+').');
    return;
  }
  video.srcObject=stream;
  try{ await video.play(); }catch(e){}
  track=stream.getVideoTracks()[0];

  try{ await track.applyConstraints({ advanced:[{ focusMode:'continuous' }] }); }catch(e){}

  detectorNativo=await armarNativo();
  zx=armarZXing();
  motor = detectorNativo ? 'lector del iPhone' : (zx ? 'ZXing' : (window.Html5Qrcode ? 'html5-qrcode' : 'ninguno'));
  if(!detectorNativo && !zx && !window.Html5Qrcode){
    fallar('No se pudo cargar el motor de lectura. Abrila con internet la primera vez y recargá.');
    return;
  }
  if(!detectorNativo && !zx){ motor='solo foto'; }
  $('pMotor').textContent='Motor: '+motor;

  corriendo=true; t0=performance.now(); intentos=0;
  $('inicio').classList.add('oculto');
  $('mira').classList.remove('oculto');
  $('barraArriba').classList.remove('oculto');
  $('barraAbajo').classList.remove('oculto');
  prepararControles();
  requestAnimationFrame(bucle);
}
function fallar(msg){
  var e=$('errorMsg'); e.textContent=msg; e.classList.remove('oculto');
}

function prepararControles(){
  var cap={};
  try{ cap=track.getCapabilities ? track.getCapabilities() : {}; }catch(e){}
  if(cap.torch) $('btnLinterna').disabled=false;
  if(cap.zoom){
    var z=$('zoom');
    z.min=cap.zoom.min||1; z.max=Math.min(cap.zoom.max||4,6); z.step=cap.zoom.step||.1;
    var arranque=Math.min((cap.zoom.min||1)*2, z.max);
    z.value=arranque;
    $('zonaZoom').classList.remove('oculto');
    aplicarZoom(arranque);
  }
}
function aplicarZoom(v){
  $('zoomVal').textContent=(+v).toFixed(1).replace('.',',')+'×';
  if(!track) return;
  track.applyConstraints({ advanced:[{ zoom:+v }] }).catch(function(){});
}
$('zoom').addEventListener('input',function(){ aplicarZoom(this.value); });

var linterna=false;
$('btnLinterna').addEventListener('click',function(){
  if(!track) return;
  linterna=!linterna;
  track.applyConstraints({ advanced:[{ torch:linterna }] })
    .then(function(){ $('btnLinterna').classList.toggle('on',linterna); })
    .catch(function(){ linterna=false; $('btnLinterna').disabled=true; });
});
$('btnGirar').addEventListener('click',function(){
  girado=!girado;
  this.classList.toggle('on',girado);
});

/* ================= bucle de lectura ================= */
var ultimoIntento=0, INTERVALO=90;
function bucle(){
  if(!corriendo) return;
  var ahora=performance.now();
  if(!ocupado && ahora-ultimoIntento>=INTERVALO){
    ultimoIntento=ahora;
    intentar();
  }
  requestAnimationFrame(bucle);
}

function recorte(){
  var vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;
  /* la banda del recuadro, en píxeles reales de la cámara */
  var bw=Math.round(vw*0.94), bh=Math.round(vh*0.30);
  /* pasada 1: la mitad central, ampliada al doble → códigos chicos */
  var escala=1;
  if(pasada%2===1){ bw=Math.round(bw*0.55); bh=Math.round(bh*0.7); escala=2; }
  var bx=Math.round((vw-bw)/2), by=Math.round((vh-bh)/2);
  var aw=Math.min(Math.round(bw*escala),1920), ah=Math.round(bh*escala*(aw/(bw*escala)));
  if(girado){ lienzo.width=ah; lienzo.height=aw; } else { lienzo.width=aw; lienzo.height=ah; }
  ctx.save();
  if(girado){ ctx.translate(ah,0); ctx.rotate(Math.PI/2); }
  ctx.drawImage(video, bx,by,bw,bh, 0,0,aw,ah);
  ctx.restore();
  return { w:lienzo.width, h:lienzo.height };
}

async function intentar(){
  ocupado=true;
  try{
    var r=recorte();
    if(!r){ ocupado=false; return; }
    intentos++;
    if(verPrevio) dibujarPrevio();
    var hallazgo=null;
    if(detectorNativo) hallazgo=await leerConNativo(lienzo);
    if(!hallazgo && zx) hallazgo=leerConZXing(ctx.getImageData(0,0,r.w,r.h));
    pasada++;
    if(hallazgo && hallazgo.texto) anotar(hallazgo.texto,hallazgo.formato);
    diagnostico();
  }catch(e){}
  ocupado=false;
}
function dibujarPrevio(){
  previo.width=120; previo.height=Math.max(Math.round(120*lienzo.height/lienzo.width),20);
  pctx.drawImage(lienzo,0,0,previo.width,previo.height);
}
function diagnostico(){
  var seg=(performance.now()-t0)/1000;
  var vps=seg>0 ? (intentos/seg).toFixed(1).replace('.',',') : '0';
  $('pDiag').textContent=(video.videoWidth||0)+'×'+(video.videoHeight||0)+' · '+vps+'/s';
}

function anotar(texto,formato){
  var ahora=Date.now();
  if(texto===ultimo && ahora-ultimoT<1400) return;
  var demora = tAnterior ? (ahora-tAnterior)/1000 : null;
  ultimo=texto; ultimoT=ahora; tAnterior=ahora;
  bip();
  $('mira').classList.add('ok');
  setTimeout(function(){ $('mira').classList.remove('ok'); },400);

  if(!porCodigo[texto]) porCodigo[texto]={ codigo:texto, fmt:formato, veces:0, hora:ahora };
  porCodigo[texto].veces++; porCodigo[texto].hora=ahora;
  lecturas.push({ codigo:texto, demora:demora });

  $('codigo').textContent=texto;
  $('codigo').classList.remove('esperando');
  $('meta').innerHTML='<b>'+formato+'</b>'+
    (demora!==null?'<small>'+demora.toFixed(1).replace('.',',')+' s desde el anterior</small>':'<small>primera lectura</small>')+
    (porCodigo[texto].veces>1?'<small>repetido ×'+porCodigo[texto].veces+'</small>':'');
  pintar();
}

/* ================= foto de alta resolución ================= */
$('btnFoto').addEventListener('click',function(){ $('archivoFoto').click(); });
var ultimoArchivo=null;
$('archivoFoto').addEventListener('change',function(){
  var f=this.files && this.files[0];
  this.value='';
  if(!f) return;
  ultimoArchivo=f;
  var img=new Image();
  img.onload=function(){ URL.revokeObjectURL(img.src); leerFoto(img); };
  img.onerror=function(){ mostrarAviso('No pude abrir esa foto.'); };
  img.src=URL.createObjectURL(f);
});
async function leerFoto(img){
  mostrarAviso('Analizando la foto…');
  var ancho=Math.min(img.naturalWidth,2600);
  var alto=Math.round(img.naturalHeight*(ancho/img.naturalWidth));
  var c=document.createElement('canvas'), cx=c.getContext('2d',{willReadFrequently:true});
  var pruebas=[
    {x:0,y:0,w:1,h:1,esc:1},            /* foto entera */
    {x:.1,y:.28,w:.8,h:.44,esc:1.6},    /* centro ampliado */
    {x:.2,y:.36,w:.6,h:.28,esc:2.4}     /* centro chico, más ampliado */
  ];
  for(var i=0;i<pruebas.length;i++){
    var p=pruebas[i];
    var sw=Math.round(img.naturalWidth*p.w), sh=Math.round(img.naturalHeight*p.h);
    var sx=Math.round(img.naturalWidth*p.x), sy=Math.round(img.naturalHeight*p.y);
    var dw=Math.min(Math.round(sw*p.esc*(ancho/img.naturalWidth)),2600);
    var dh=Math.round(sh*(dw/sw));
    c.width=dw; c.height=dh;
    cx.drawImage(img,sx,sy,sw,sh,0,0,dw,dh);
    var hallazgo=null;
    if(detectorNativo) hallazgo=await leerConNativo(c);
    if(!hallazgo && zx) hallazgo=leerConZXing(cx.getImageData(0,0,dw,dh));
    if(hallazgo && hallazgo.texto){ anotar(hallazgo.texto,hallazgo.formato+' · foto'); return; }
  }
  if(window.Html5Qrcode && ultimoArchivo){
    try{
      var lecturaArchivo=new Html5Qrcode('cajaArchivo',{ verbose:false });
      var r2=await lecturaArchivo.scanFileV2(ultimoArchivo,false);
      if(r2 && r2.decodedText){ anotar(r2.decodedText,'foto'); return; }
    }catch(e){}
  }
  mostrarAviso('En la foto tampoco lo encontré. Probá con más luz, sin reflejo y con el código bien derecho.');
}
function mostrarAviso(t){
  $('codigo').textContent=t;
  $('codigo').classList.add('esperando');
  $('meta').innerHTML='';
}

/* ================= lista ================= */
function pintar(){
  var claves=Object.keys(porCodigo);
  $('cuenta').textContent=claves.length;
  $('mDistintos').textContent=claves.length;
  $('mTotal').textContent=lecturas.length;
  var conD=lecturas.filter(function(l){ return l.demora!==null && l.demora<90; });
  $('mProm').textContent = conD.length
    ? (conD.reduce(function(a,l){ return a+l.demora; },0)/conD.length).toFixed(1).replace('.',',')+' s'
    : '—';
  var orden=claves.map(function(k){ return porCodigo[k]; }).sort(function(a,b){ return b.hora-a.hora; });
  $('lista').innerHTML = orden.length ? orden.map(function(p){
    var d=new Date(p.hora), hh=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
    return '<div class="item"><div><b>'+p.codigo+'</b><small>'+p.fmt+' · '+hh+'</small></div>'+
      '<div class="veces">'+(p.veces>1?'<em>×'+p.veces+'</em>':'1')+'</div></div>';
  }).join('') : '<p class="vacio">Todavía no leyó ningún código.</p>';
  $('diagnostico').innerHTML='Motor: <b>'+motor+'</b> · cámara <b>'+(video.videoWidth||0)+'×'+(video.videoHeight||0)+
    '</b> · <b>'+intentos+'</b> intentos de lectura'+(viaZX?' · vía '+viaZX:'')+(girado?' · girado':'');
}
$('btnLista').addEventListener('click',function(){ $('hoja').classList.add('on'); pintar(); });
$('btnCerrar').addEventListener('click',function(){ $('hoja').classList.remove('on'); });
$('btnLimpiar').addEventListener('click',function(){
  lecturas=[]; porCodigo={}; ultimo=''; ultimoT=0; tAnterior=0; intentos=0; t0=performance.now();
  $('codigo').textContent='Apuntá al código de barras…';
  $('codigo').classList.add('esperando');
  $('meta').innerHTML=''; pintar();
});
$('btnCompartir').addEventListener('click',function(){
  var claves=Object.keys(porCodigo);
  if(!claves.length) return;
  var l=['Prueba de escáner · '+new Date().toLocaleString('es-AR'),'Motor: '+motor+' · cámara '+video.videoWidth+'×'+video.videoHeight,''];
  claves.map(function(k){ return porCodigo[k]; }).sort(function(a,b){ return a.hora-b.hora; })
    .forEach(function(p){ l.push(p.codigo+'  ('+p.fmt+')  ×'+p.veces); });
  l.push('', claves.length+' productos, '+lecturas.length+' lecturas, promedio '+$('mProm').textContent);
  var t=l.join('\n');
  if(navigator.share) navigator.share({ title:'Prueba de escáner', text:t }).catch(function(){});
  else if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ $('btnCompartir').textContent='Copiado'; });
});

/* toque largo en el diagnóstico: ver lo que analiza la cámara */
$('pDiag').addEventListener('click',function(){
  verPrevio=!verPrevio;
  previo.classList.toggle('oculto',!verPrevio);
});

$('btnEncender').addEventListener('click',encender);
pintar();
})();
